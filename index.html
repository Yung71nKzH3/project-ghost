<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Browser HUD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

    :root {
      --bg-glass: rgba(10, 14, 23, 0.88);
      --bg-glass-card: rgba(18, 24, 38, 0.75);
      --border-accent: rgba(0, 240, 255, 0.35);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --primary: #00f0ff;
      --primary-glow: rgba(0, 240, 255, 0.4);
      --accent: #a855f7;
      --warning: #ffb700;
      --text-main: #f3f4f6;
      --text-dim: #9ca3af;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      user-select: none;
    }

    /* --- UI OVERLAY LAYER --- */
    #ui-layer {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.25s;
    }

    /* Sleek Cyber-Glass HUD Card */
    #command-box {
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius);
      padding: 24px;
      width: 680px;
      max-width: 92vw;
      display: flex; flex-direction: column; gap: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--primary-glow);
      pointer-events: auto;
      color: var(--text-main);
      animation: floatIn 0.3s ease-out;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hud-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
    }

    .hud-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px; font-weight: 700;
      letter-spacing: 2px;
      color: var(--primary);
      display: flex; align-items: center; gap: 8px;
    }
    .hud-title::before {
      content: ''; display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
    }

    .hud-badge {
      font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 20px;
      background: rgba(0, 240, 255, 0.12);
      color: var(--primary);
      border: 1px solid var(--border-accent);
      text-transform: uppercase;
    }

    /* URL Bar Group */
    .input-group {
      display: flex; gap: 10px; align-items: center;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px; font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    /* Quick Launch Shortcuts */
    .quick-launch {
      display: flex; gap: 8px; align-items: center; font-size: 12px;
    }
    .quick-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-dim);
      padding: 4px 10px; border-radius: 6px;
      cursor: pointer; transition: all 0.2s;
      font-size: 11px; font-weight: 500;
    }
    .quick-chip:hover {
      background: rgba(0, 240, 255, 0.15);
      color: var(--primary);
      border-color: var(--primary);
    }

    /* Slider & Preset Controls */
    .control-row {
      display: flex; flex-direction: column; gap: 8px;
      background: var(--bg-glass-card);
      padding: 12px 16px; border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .control-label-group {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--text-dim); font-weight: 600;
    }

    .presets-group {
      display: flex; gap: 6px;
    }
    .preset-btn {
      padding: 2px 8px; font-size: 10px; min-width: auto;
      border-radius: 4px; background: rgba(255,255,255,0.08);
      border: 1px solid var(--border-subtle); color: var(--text-dim);
    }
    .preset-btn:hover {
      background: var(--primary); color: #000; border-color: var(--primary);
    }

    input[type="range"] {
      width: 100%; accent-color: var(--primary); cursor: pointer; height: 4px;
    }

    /* Action Buttons Row */
    .button-group {
      display: flex; gap: 10px; flex-wrap: wrap;
    }

    button {
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 10px 16px; border-radius: 8px;
      cursor: pointer; font-weight: 600; font-size: 13px;
      font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.2s ease;
    }
    button:hover {
      background: var(--primary);
      color: #090d16;
      border-color: var(--primary);
      box-shadow: 0 0 14px var(--primary-glow);
    }
    button.primary-btn {
      background: var(--primary);
      color: #090d16;
      border-color: var(--primary);
    }
    button.primary-btn:hover {
      background: #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.5);
    }

    button.active {
      background: var(--warning);
      color: #000;
      border-color: var(--warning);
      box-shadow: 0 0 15px rgba(255, 183, 0, 0.4);
    }

    /* Source Selector Row */
    #projector-controls {
      display: none; flex-direction: column; gap: 8px;
      background: rgba(255, 183, 0, 0.08);
      border: 1px solid rgba(255, 183, 0, 0.3);
      padding: 12px 16px; border-radius: 8px;
    }
    #projector-controls.visible { display: flex; }

    select {
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 8px 12px; border-radius: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      outline: none; width: 100%;
    }
    select:focus { border-color: var(--warning); }

    /* Shortcuts Legend Card */
    .shortcuts-legend {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      background: rgba(0, 0, 0, 0.25); padding: 10px; border-radius: 8px;
      font-size: 11px; text-align: center; border: 1px solid var(--border-subtle);
    }
    .shortcut-item { display: flex; flex-direction: column; gap: 2px; }
    .shortcut-key {
      font-family: 'JetBrains Mono', monospace; font-weight: 700;
      color: var(--primary); background: rgba(0, 240, 255, 0.1);
      padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(0, 240, 255, 0.2);
    }
    .shortcut-desc { color: var(--text-dim); font-size: 10px; }

    /* --- FLOATING STATUS TOAST --- */
    #status-toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-accent);
      color: var(--primary);
      padding: 8px 16px; border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 15px var(--primary-glow);
      z-index: 10000;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      display: flex; align-items: center; gap: 8px;
    }
    #status-toast .pulse-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--primary); box-shadow: 0 0 6px var(--primary);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* --- CONTENT CONTAINER & MEDIA --- */
    #view-container {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      overflow: hidden;
      transition: opacity 0.15s ease;
    }

    webview {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      border: none; z-index: 2;
    }

    video {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: fill;
      pointer-events: none; z-index: 3;
    }

    /* Utility Visibility Classes */
    .hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>

  <!-- UI COMMAND CENTER OVERLAY -->
  <div id="ui-layer" class="hidden">
    <div id="command-box">
      
      <!-- HEADER -->
      <div class="hud-header">
        <div class="hud-title">GHOST // OVERLAY HUD</div>
        <div class="hud-badge" id="mode-badge">MODE: COMMAND</div>
      </div>

      <!-- TARGET URL INPUT -->
      <div class="input-group">
        <input type="text" id="urlInput" placeholder="ENTER TARGET URL OR SEARCH..." autofocus />
        <button class="primary-btn" onclick="navigate()">GO ➔</button>
      </div>

      <!-- QUICK LAUNCH CHIPS -->
      <div class="quick-launch">
        <span style="color: var(--text-dim);">PRESETS:</span>
        <span class="quick-chip" onclick="quickNav('https://youtube.com')">YouTube</span>
        <span class="quick-chip" onclick="quickNav('https://twitch.tv')">Twitch</span>
        <span class="quick-chip" onclick="quickNav('https://netflix.com')">Netflix (Projector)</span>
        <span class="quick-chip" onclick="quickNav('https://primevideo.com')">Prime (Projector)</span>
        <span class="quick-chip" onclick="quickNav('https://disneyplus.com')">Disney+ (Projector)</span>
      </div>

      <!-- OPACITY CONTROLS -->
      <div class="control-row">
        <div class="control-label-group">
          <span>OVERLAY OPACITY</span>
          <div style="display: flex; align-items: center; gap: 10px;">
            <div class="presets-group">
              <button class="preset-btn" onclick="setOpacity(0.25)">25%</button>
              <button class="preset-btn" onclick="setOpacity(0.50)">50%</button>
              <button class="preset-btn" onclick="setOpacity(0.75)">75%</button>
              <button class="preset-btn" onclick="setOpacity(1.0)">100%</button>
            </div>
            <span id="opacityVal" style="color: var(--primary); font-family: 'JetBrains Mono'; font-weight:700;">100%</span>
          </div>
        </div>
        <input type="range" id="opacitySlider" min="0.1" max="1" step="0.05" value="1">
      </div>

      <!-- DYNAMIC PROJECTOR WINDOW SELECTOR -->
      <div id="projector-controls">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 11px; font-weight: 700; color: var(--warning);">PROJECTOR CAPTURE SOURCE</span>
          <button style="padding: 2px 8px; font-size: 10px;" onclick="refreshSources()">⚡ Refresh Windows</button>
        </div>
        <div style="display: flex; gap: 8px;">
          <select id="sourceSelect">
            <option value="">-- Select Active Window --</option>
          </select>
          <button id="projectorBtn" class="active" onclick="startProjectorSelected()">PROJECT SOURCE</button>
        </div>
      </div>

      <!-- ACTIONS BAR -->
      <div class="button-group">
        <button id="glassBtn" onclick="toggleGlassMode()">✨ GLASS FX</button>
        <button id="fitBtn" onclick="toggleCinemaMode()">📐 FIT: FILL</button>
        <button id="muteBtn" onclick="toggleMute()">🔊 SOUND: ON</button>
        <button id="projToggleBtn" onclick="toggleProjectorPanel()">📽️ PROJECTOR PANEL</button>
      </div>

      <!-- KEYBOARD SHORTCUTS LEGEND -->
      <div class="shortcuts-legend">
        <div class="shortcut-item">
          <span class="shortcut-key">Ctrl+Shift+X / Alt+G</span>
          <span class="shortcut-desc">Command HUD</span>
        </div>
        <div class="shortcut-item">
          <span class="shortcut-key">Ctrl+Shift+Z / Alt+Z</span>
          <span class="shortcut-desc">Mouse Interactivity</span>
        </div>
        <div class="shortcut-item">
          <span class="shortcut-key">Ctrl+Shift+H / Alt+H</span>
          <span class="shortcut-desc">Hide / Unhide All</span>
        </div>
      </div>

    </div>
  </div>

  <!-- FLOATING STATUS TOAST -->
  <div id="status-toast" onclick="toggleHUDViaToast()" title="Click to Toggle HUD">
    <div class="pulse-dot"></div>
    <span id="toast-text">STATUS: GHOST READY</span>
  </div>

  <!-- VIEW CONTAINER (CONTENT OVERLAY) -->
  <div id="view-container">
    <webview id="view" src="about:blank" allowpopups plugins></webview>
    <video id="projector" class="hidden" autoplay muted></video>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const uiLayer = document.getElementById('ui-layer');
    const toastText = document.getElementById('toast-text');
    const modeBadge = document.getElementById('mode-badge');
    const view = document.getElementById('view');
    const video = document.getElementById('projector');
    const input = document.getElementById('urlInput');
    const glassBtn = document.getElementById('glassBtn');
    const fitBtn = document.getElementById('fitBtn');
    const muteBtn = document.getElementById('muteBtn');
    const slider = document.getElementById('opacitySlider');
    const opacityVal = document.getElementById('opacityVal');
    const projectorPanel = document.getElementById('projector-controls');
    const sourceSelect = document.getElementById('sourceSelect');

    let currentMode = 'GHOST';
    let glassKey = null;
    let isMuted = false;
    let fitModes = ['fill', 'contain', 'cover'];
    let fitIndex = 0;

    // --- NAVIGATION ---
    function navigate() {
      let url = input.value.trim();
      if (!url) return;

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        if (url.includes('.') && !url.includes(' ')) {
          url = 'https://' + url;
        } else {
          url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
        }
      }

      const restricted = ['netflix.com', 'primevideo.com', 'amazon.com/video', 'amazon.co.uk/video', 'disneyplus.com', 'hulu.com', 'max.com', 'tv.apple.com'];
      const isRestricted = restricted.some(site => url.includes(site));

      if (isRestricted) {
        showToast("LAUNCHING EXTERNAL PROJECTOR...");
        ipcRenderer.send('launch-external', url);

        projectorPanel.classList.add('visible');
        view.classList.add('hidden');
        video.classList.remove('hidden');

        refreshSources();
        setMode('COMMAND');
      } else {
        view.src = url;
        view.classList.remove('hidden');
        video.classList.add('hidden');
        showToast(`NAVIGATING: ${url}`);
        setMode('GHOST');
      }
    }

    function quickNav(url) {
      input.value = url;
      navigate();
    }

    // --- PROJECTOR SOURCE RESOLUTION ---
    async function refreshSources() {
      showToast("SCANNING WINDOW SOURCES...");
      const sources = await ipcRenderer.invoke('get-sources');
      sourceSelect.innerHTML = '<option value="">-- Select Active Window --</option>';

      sources.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.innerText = s.name;
        sourceSelect.appendChild(opt);
      });

      // Pre-select Chrome/Netflix if available
      const bestMatch = sources.find(s => 
        s.name.toLowerCase().includes('netflix') ||
        s.name.toLowerCase().includes('prime video') ||
        s.name.toLowerCase().includes('google chrome')
      );

      if (bestMatch) {
        sourceSelect.value = bestMatch.id;
      }
      showToast(`FOUND ${sources.length} WINDOW SOURCES`);
    }

    async function startProjectorSelected() {
      let targetId = sourceSelect.value;
      
      if (!targetId) {
        await refreshSources();
        targetId = sourceSelect.value;
      }

      if (!targetId && sourceSelect.options.length > 1) {
        targetId = sourceSelect.options[1].value;
      }

      if (!targetId) {
        showToast("ERROR: NO WINDOW SELECTED");
        return;
      }

      const selectedName = sourceSelect.options[sourceSelect.selectedIndex]?.text || "Selected Window";
      showToast(`PROJECTING: ${selectedName}`);

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            mandatory: {
              chromeMediaSource: 'desktop',
              chromeMediaSourceId: targetId,
              minWidth: 0,
              maxWidth: 3840,
              minHeight: 0,
              maxHeight: 2160
            }
          }
        });

        video.srcObject = stream;
        video.play();
        setMode('GHOST');
      } catch (e) {
        console.error(e);
        showToast("CAPTURE ERROR: " + e.message);
      }
    }

    function toggleProjectorPanel() {
      projectorPanel.classList.toggle('visible');
      if (projectorPanel.classList.contains('visible')) {
        refreshSources();
      }
    }

    // --- OPACITY CONTROLS ---
    function setOpacity(val) {
      document.getElementById('view-container').style.opacity = val;
      slider.value = val;
      opacityVal.innerText = Math.round(val * 100) + '%';
    }

    slider.addEventListener('input', (e) => setOpacity(e.target.value));

    // --- MODE SWITCHING ---
    function setMode(mode) {
      currentMode = mode;
      modeBadge.innerText = `MODE: ${mode === 'STEALTH' ? 'INTERACTIVE' : mode}`;

      if (mode === 'GHOST') {
        uiLayer.classList.add('hidden');
        showToast("STATUS: GHOST (PASS-THROUGH ACTIVE)");
        ipcRenderer.send('set-ignore-mouse', { ignore: true, forward: false });
      } else if (mode === 'STEALTH') {
        uiLayer.classList.add('hidden');
        showToast("STATUS: INTERACTIVE (MOUSE ACTIVE)");
        ipcRenderer.send('set-ignore-mouse', { ignore: false });
      } else if (mode === 'COMMAND') {
        uiLayer.classList.remove('hidden');
        showToast("STATUS: COMMAND HUD");
        ipcRenderer.send('set-ignore-mouse', { ignore: false });
        input.focus();
      } else if (mode === 'HIDDEN') {
        uiLayer.classList.add('hidden');
        document.getElementById('view-container').classList.add('hidden');
        showToast("STATUS: HIDDEN");
        ipcRenderer.send('set-ignore-mouse', { ignore: true, forward: false });
      }

      if (mode !== 'HIDDEN') {
        document.getElementById('view-container').classList.remove('hidden');
      }
    }

    ipcRenderer.on('toggle-stealth', () => {
      // Toggle between GHOST (pass-through) and STEALTH (interactive mouse)
      setMode(currentMode === 'STEALTH' ? 'GHOST' : 'STEALTH');
    });
    
    ipcRenderer.on('toggle-command', () => {
      // Toggle between COMMAND (HUD) and GHOST (pass-through)
      setMode(currentMode === 'COMMAND' ? 'GHOST' : 'COMMAND');
    });
    
    ipcRenderer.on('toggle-hide', () => {
      // Toggle between HIDDEN and GHOST
      setMode(currentMode === 'HIDDEN' ? 'GHOST' : 'HIDDEN');
    });

    ipcRenderer.on('projector-error', (event, msg) => showToast(msg));

    function toggleHUDViaToast() {
      setMode(currentMode === 'COMMAND' ? 'GHOST' : 'COMMAND');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        setMode(currentMode === 'COMMAND' ? 'GHOST' : 'COMMAND');
      }
    });

    // Handle WebView Load Errors Gracefully
    view.addEventListener('did-fail-load', (e) => {
      // ERR_ABORTED (-3) is a normal guest view navigation cancel, ignore it
      if (e.errorCode !== -3) {
        showToast(`LOAD ERROR: ${e.errorDescription} (${e.errorCode})`);
      }
    });

    // --- MEDIA CONTROLS & UTILS ---
    async function toggleGlassMode() {
      if (view.classList.contains('hidden')) {
        showToast("GLASS FX ONLY APPLIES TO WEBVIEW");
        return;
      }

      if (glassKey) {
        await view.removeInsertedCSS(glassKey);
        glassKey = null;
        glassBtn.classList.remove('active');
        showToast("GLASS FX: DISABLED");
      } else {
        const css = `html, body, #content, #page-manager, ytd-app { background: transparent !important; }`;
        glassKey = await view.insertCSS(css);
        glassBtn.classList.add('active');
        showToast("GLASS FX: ENABLED");
      }
    }

    function toggleCinemaMode() {
      if (!video.classList.contains('hidden')) {
        fitIndex = (fitIndex + 1) % fitModes.length;
        const fit = fitModes[fitIndex];
        video.style.objectFit = fit;
        fitBtn.innerText = `📐 FIT: ${fit.toUpperCase()}`;
        showToast(`VIDEO FIT: ${fit.toUpperCase()}`);
      } else {
        view.executeJavaScript(`(function(){
          const v = document.querySelector('video');
          if(!v) return;
          v.style.cssText = v.style.position === 'fixed' ? '' : 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99999;background:black;';
        })();`);
        showToast("WEBVIEW FULLSCREEN TOGGLED");
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      video.muted = isMuted;
      view.setAudioMuted(isMuted);
      muteBtn.innerText = isMuted ? "🔇 SOUND: MUTED" : "🔊 SOUND: ON";
      muteBtn.classList.toggle('active', isMuted);
      showToast(isMuted ? "AUDIO MUTED" : "AUDIO UNMUTED");
    }

    function showToast(text) {
      toastText.innerText = text;
      const toast = document.getElementById('status-toast');
      toast.style.opacity = '1';
      toast.style.transform = 'translateY(0)';
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        if (currentMode === 'GHOST') {
          toast.style.opacity = '0.4';
        }
      }, 3500);
    }

    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') navigate(); });

    // Initialize HUD in COMMAND mode on startup so user sees controls right away
    setMode('COMMAND');
  </script>
</body>
</html>
